name: Release

# Cut a release by pushing a version tag:  git tag v0.2.0 && git push origin v0.2.0
# (or run manually from the Actions tab with a tag name).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true

permissions:
  contents: write   # needed to create the GitHub Release and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: kotlin
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK with version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cp kotlin/app/build/outputs/apk/debug/app-debug.apk "mouse-android-${TAG}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mouse-android-*.apk

  ios:
    name: iOS simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        working-directory: swift
        run: xcodegen generate

      # A signed .ipa for TestFlight/App Store needs Apple signing secrets
      # (see RELEASING.md). Until those are configured, the release ships a
      # simulator .app zipped for reviewers who want to run it without Xcode.
      - name: Build for simulator
        working-directory: swift
        run: |
          xcodebuild -project Mouse.xcodeproj -scheme Mouse \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Zip the simulator app
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          APP=$(find swift/build -name 'Mouse.app' -path '*Release-iphonesimulator*' | head -1)
          ditto -c -k --keepParent "$APP" "mouse-ios-sim-${TAG}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-sim-app
          path: mouse-ios-sim-*.zip

  release:
    name: Publish release
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Mouse ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: true
          files: |
            artifacts/android-apk/mouse-android-*.apk
            artifacts/ios-sim-app/mouse-ios-sim-*.zip
