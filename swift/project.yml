name: Mouse
options:
  bundleIdPrefix: com.reagentsystems
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "6.0"
targets:
  Mouse:
    type: application
    platform: iOS
    sources:
      - path: Mouse
        excludes:
          - Fonts
      - path: Mouse/Fonts/IBMPlexMono-Bold.ttf
        buildPhase: resources
    # UIAppFonts has no INFOPLIST_KEY_* build setting, so it must come from a real Info.plist;
    # Xcode merges this file with the generated one.
    info:
      path: Mouse/Info.plist
      properties:
        UIAppFonts: [IBMPlexMono-Bold.ttf]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.reagentsystems.mouse.swift
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      # iPhone is portrait-locked (the layout is a vertical lane stack). iPad supports all
      # orientations — required for multitasking — and clamps its window to an iPhone-sized
      # minimum via UIWindowScene.sizeRestrictions (see MouseApp).
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      ENABLE_PREVIEWS: YES
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
